name: Build and Push Docker Image

on:
  push:
    branches: [ main ]  # Jab bhi main branch par push hoga
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: shivam843104/my-node-app # Apna Docker Hub username daalo
  DOCKER_TAG: ${{ github.sha }}  # Commit hash ko tag banao

permissions:
  contents: write  

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          ${{ env.DOCKER_IMAGE }}:latest

    - name: Update Kubernetes deployment
      run: |
        # YAML file mein image tag update karo
        sed -i "s|image:.*|image: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}|g" k8s/manifests/deployment.yaml
        
        # Commit aur push karo
        git config user.name "shivamkumar076"
        git config user.email "shivamkumar776499@gmail.com"
        git add k8s/manifests/deployment.yaml
        git commit -m "Update image tag to ${{ env.DOCKER_TAG }}" || echo "No changes"
        git push